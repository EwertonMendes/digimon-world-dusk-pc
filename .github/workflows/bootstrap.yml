name: One-time source import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/initial-native-foundation
          persist-credentials: true
      - name: Expand ROM-free source archive into versioned files
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/native-source.tar.xz
          tar -tJf bootstrap/native-source.tar.xz | grep -vE '(^/|\.\.|\.nds$|\.bin$)' > /dev/null
          tar -xJf bootstrap/native-source.tar.xz -C .
          rm bootstrap/native-source.tar.xz
          rmdir bootstrap
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: import native foundation source and Windows CI"
          git push origin HEAD:feature/initial-native-foundation
