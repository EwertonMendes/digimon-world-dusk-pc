name: Build and test - ROM free
on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} native prototype
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUSK_BUILD_TESTS=ON
      - name: Validate Python research tooling syntax
        if: runner.os == 'Linux'
        run: python3 -m py_compile tools/test_dusk_native_story.py tools/prepare_dusk_recomp.py
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUSK_BUILD_TESTS=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows executable (presentation prototype, NOT the game)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dusk-pc-windows-presentation-prototype
          path: |
            build/Release/dusk_pc.exe
            build/Release/dusk_rom_info.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux ROM analyzer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dusk-rom-inspector-linux
          path: build/dusk_rom_info
          if-no-files-found: error
          retention-days: 14

  upstream-recompiler:
    name: NDSRecomp decode and cycle tests (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
      - name: Build the standalone upstream recompiler (no game files)
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --parallel 2
      - name: Run ARM instruction and cycle tests
        run: |
          ./upstream/recompiler/build/armv5te_decode_test
          ./upstream/recompiler/build/interpreter_cycle_test
      - name: Package exact public upstream runtime source for offline diagnostics
        shell: bash
        run: |
          tar -cJf upstream-source.tar.xz -C upstream --exclude=.git --exclude=recompiler/build .
      - name: Upload upstream source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ndsrecomp-upstream-source-pinned
          path: upstream-source.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: Package pinned public recomp-ui dependency for offline diagnostics
        shell: bash
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
          tar -cJf recomp-ui-source.tar.xz -C recomp-ui --exclude=.git .
      - name: Upload recomp-ui source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: recomp-ui-upstream-source-pinned
          path: recomp-ui-source.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux native recompiler utility
        uses: actions/upload-artifact@v4
        with:
          name: nds-recompiler-linux-x64
          path: upstream/recompiler/build/nds_recompile
          if-no-files-found: error
          retention-days: 14
      - name: Validate Dusk bank generator against real recompiler with synthetic ARM
        env:
          NDS_RECOMPILER: ./upstream/recompiler/build/nds_recompile
        run: python3 tests/test_recomp_pipeline.py

  upstream-recompiler-windows:
    name: Windows ARM static recompiler toolchain
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NDSRecomp toolchain
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
      - name: Build Windows recompiler
        shell: pwsh
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
      - name: Verify recompiler binary
        shell: pwsh
        run: |
          if (!(Test-Path upstream/recompiler/build/nds_recompile.exe)) { throw "Expected nds_recompile.exe missing" }
          & ./upstream/recompiler/build/nds_recompile.exe --codegen-identity
      - name: Upload native Windows static recompiler utility
        uses: actions/upload-artifact@v4
        with:
          name: nds-recompiler-windows-x64
          path: upstream/recompiler/build/nds_recompile.exe
          if-no-files-found: error
          retention-days: 14

  freebios-headless-windows:
    name: ROM-free Windows native runner feasibility (experimental)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NDSRecomp + apply FreeBIOS-only diagnostic patch
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
          git -C upstream apply ../tools/patches/ndsrecomp-freebios-diagnostic.patch
          if ($LASTEXITCODE -ne 0) { throw 'FreeBIOS patch failed' }
          git -C upstream apply ../tools/patches/ndsrecomp-libslirp-win32.patch
          if ($LASTEXITCODE -ne 0) { throw 'WinSock patch failed' }
          git -C upstream apply ../tools/patches/ndsrecomp-tftp-win32.patch
          if ($LASTEXITCODE -ne 0) { throw 'TFTP patch failed' }
          python tools/patch_windows_net.py upstream
          if ($LASTEXITCODE -ne 0) { throw 'Net_Slirp Win32 guard patch failed' }
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
      - name: Build Windows ARM static recompiler
        shell: pwsh
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
      - name: Generate open FreeBIOS code banks
        shell: pwsh
        run: |
          $bin = "./upstream/recompiler/build/nds_recompile.exe"
          & $bin --config upstream/bios/freebios9.toml --bin upstream/third_party/freebios/drastic_bios_arm9.bin --out upstream/generated --bank freebios_arm9
          if ($LASTEXITCODE -ne 0) { throw "FreeBIOS ARM9 failed" }
          & $bin --config upstream/bios/freebios7.toml --bin upstream/third_party/freebios/drastic_bios_arm7.bin --out upstream/generated --bank freebios_arm7
          if ($LASTEXITCODE -ne 0) { throw "FreeBIOS ARM7 failed" }
      - name: Compile ROM-free Windows native hardware runtime
        shell: pwsh
        run: |
          $uiPath = (Resolve-Path ./recomp-ui).Path
          $cmakeArgs = @(
            "-S", "upstream/runner",
            "-B", "upstream/runner/build-windows",
            "-G", "Ninja",
            "-DCMAKE_C_COMPILER=clang",
            "-DCMAKE_CXX_COMPILER=clang++",
            "-DCMAKE_CXX_FLAGS=-DNOMINMAX",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DNDS_SDL_BACKEND=NONE",
            "-DNDS_ENABLE_COMPUTE_RENDERER=OFF",
            "-DNDS_BOOTSTRAP_FIRMWARE=ON",
            "-DNDS_DIAGNOSTIC_FREEBIOS_ONLY=ON",
            "-DNDS_RECOMP_UI_ROOT=$uiPath"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "Runner CMake configure failed" }
          & cmake --build upstream/runner/build-windows --target nds_runner --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Runner compilation failed" }
          if (!(Test-Path upstream/runner/build-windows/nds_runner.exe)) { throw "Windows nds_runner.exe missing" }
      - name: Verify Windows binary exists (no game code)
        shell: pwsh
        run: |
          $output = (Get-Item upstream/runner/build-windows/nds_runner.exe).Length
          Write-Host "Windows native runner compiled; bytes=$output (NO Dusk game banks)"

  private-build-toolchain:
    name: Windows cross toolchain for private local game build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned standalone Zig C/C++ Windows cross compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sha256sum zig.tar.xz
          tar -tJf zig.tar.xz | head -n 12 || true
      - name: Upload local private build toolchain (ROM-free)
        uses: actions/upload-artifact@v4
        with:
          name: private-build-zig-linux-cross-windows
          path: zig.tar.xz
          if-no-files-found: error
          retention-days: 2

  portable-launcher:
    name: Windows one-click launcher (ROM-free source build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Go native launcher
        shell: pwsh
        run: |
          cd native-launcher
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Native launcher tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Native launcher vet failed" }
      - name: Produce ROM-free Windows x64 launcher template
        shell: pwsh
        run: |
          cd native-launcher
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o ../DuskPC-Launcher-Windows-x64.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows launcher build failed" }
          & ../DuskPC-Launcher-Windows-x64.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Launcher smoke check failed" }
      - name: Upload Windows launcher template (contains NO game)
        uses: actions/upload-artifact@v4
        with:
          name: dusk-windows-one-click-launcher-rom-free
          path: DuskPC-Launcher-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
