name: One-time source import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/initial-native-foundation
          persist-credentials: true
      - name: Expand known ROM-free source files
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/native-source.part* | base64 --decode > /tmp/native-source.tar.xz
          echo "980efc7a5e7ad6918849e3c84bdf86c0ca8866a91639935c5ae06f1517c5fd0c  /tmp/native-source.tar.xz" | sha256sum -c -
          tar -tJf /tmp/native-source.tar.xz | while read -r path; do
            case "$path" in /*|*..*|*.nds|*.bin|*.rom|*.sav) exit 1;; esac
          done
          tar -xJf /tmp/native-source.tar.xz -C .
          rm bootstrap/native-source.part*
          rmdir bootstrap
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add native foundation sources and Windows CI"
          git push origin HEAD:feature/initial-native-foundation
