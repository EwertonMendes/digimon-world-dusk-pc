name: Dusk native sprite focused diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sprite-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/probe_dusk_trainer_source.py --rom 'Digimon World - Dusk (USA).nds'
