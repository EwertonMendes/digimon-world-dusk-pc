name: Digimon World Dusk Recompiled - Windows v0.29
on:
  workflow_dispatch:
    inputs:
      approve_game_bundle:
        description: 'I authorize packaging the uploaded ROM into a downloadable Windows EXE'
        required: true
        type: boolean
        default: false
      fast_repack:
        description: 'Use pinned validated runner (only when native input fingerprint is unchanged)'
        required: false
        type: boolean
        default: false
      research_only:
        description: 'Run read-only localization resource probe (no game bundle)'
        required: false
        type: boolean
        default: false
      direct_exe_release:
        description: 'Publish a private owner playtest release with direct standalone .exe asset'
        required: false
        type: boolean
        default: false
      sprite_scan_only:
        description: 'Quick owner-ROM sprite atlas research only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: dusk-recompiled-v029-${{ github.ref }}-${{ inputs.fast_repack }}-${{ inputs.research_only }}
  cancel-in-progress: true

jobs:
  quick-sprite-scan:
    if: inputs.sprite_scan_only == true
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for original game atlas analysis
        run: python -m pip install Pillow==11.3.0
      - name: Locate original title PUSH START native glyphs and preview candidate cells
        shell: pwsh
        run: |
          python tools/probe_dusk_title_prompt.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Title prompt source asset scan failed' }
      - name: Analyze original shaded Nintendo Digivice label pixels
        shell: pwsh
        run: |
          python tools/probe_dusk_text_style.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Original DS font palette scan failed' }
      - name: Inspect original DS title screen background maps and tile atlases
        shell: pwsh
        run: |
          python tools/probe_dusk_title_backgrounds.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Title screen Nitro graphic source inspection failed' }
      - name: Map the original Dusk pixel-font letters in native OAM frames
        shell: pwsh
        run: |
          python tools/probe_dusk_menu_glyphs.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Original pixel font sampling failed' }
      - name: Inspect remaining small and alternate-frame sprites for PUSH START
        shell: pwsh
        run: |
          python tools/probe_dusk_title_remaining_sprites.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Narrow DS sprite source inventory failed' }
      - name: Inspect large Nintendo sprite resources used by title and logo
        shell: pwsh
        run: |
          python tools/probe_dusk_title_large_sprites.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Large OAM title graphic inventory failed' }
      - name: Search original ARM9 overlay table for title PUSH START
        shell: pwsh
        run: |
          python tools/probe_dusk_title_overlays.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM9 title overlay scan failed' }
      - name: Match unknown native title font character numbering
        shell: pwsh
        run: |
          python tools/probe_dusk_title_ordinal.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Title ordinal text encoding scan failed' }
      - name: Check alternative PUSH and START glyph encoding in original ARM9 and overlays
        shell: pwsh
        run: |
          python tools/probe_dusk_title_short_glyphs.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Title short glyph encoding probe failed' }
      - name: Inventory 8bpp and uncompressed sprite assets excluded from earlier scans
        shell: pwsh
        run: |
          python tools/probe_dusk_all_graphic_formats.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Sprite graphic-format coverage inspection failed' }
      - name: Examine 8bpp title and small HUD sprites omitted from previous probes
        shell: pwsh
        run: |
          python tools/probe_dusk_title_8bpp.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw '8bpp sprite audit failed' }
      - name: Inspect title screen sprite IDs neighboring logo and character art
        shell: pwsh
        run: |
          python tools/probe_dusk_sprite_cells.py --rom 'Digimon World - Dusk (USA).nds' --ids 620,621,622,625,626,633,634 --count 8
          if ($LASTEXITCODE -ne 0) { throw 'Title neighbors sprite audit failed' }
      - name: Decode authentic PUSH START title sprite 620 with proper OAM mapping
        shell: pwsh
        run: |
          python tools/probe_dusk_title_prompt_exact.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Title logo prompt exact OAM decode failed' }
      - name: Identify original shop option and item-action cells
        shell: pwsh
        run: |
          python tools/probe_dusk_sprite_cells.py --rom 'Digimon World - Dusk (USA).nds' --ids 477,478,479,480,481,482 --count 1
          if ($LASTEXITCODE -ne 0) { throw 'DS sprite-cell inspection failed' }
      - name: Inventory six original main-menu label graphics and SHA identities
        shell: pwsh
        run: |
          python tools/probe_dusk_sprites_visual.py --rom 'Digimon World - Dusk (USA).nds' --ids 477,478,479,480,481,482
          if ($LASTEXITCODE -ne 0) { throw 'Original Digivice graphics could not be inspected' }
      - name: Locate original Equipment Shop action labels by exact game encoding
        shell: pwsh
        run: |
          python tools/research_dusk_shop_options.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Shop text source inventory failed' }
      - name: Inspect exact ARM9 shop action string capacities
        shell: pwsh
        run: |
          python tools/research_dusk_arm9_shop_context.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'ARM9 shop text source inspection failed' }
      - name: Probe safe ARM9 shop text relocation targets
        shell: pwsh
        run: |
          python tools/research_dusk_shop_pointer_map.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Shop label pointer mapping failed' }
      - name: Render custom Nintendo-native pixel glyphs for side-by-side quality review
        shell: pwsh
        run: |
          python tools/dusk_native_menu_bitmap_proof.py --rom 'Digimon World - Dusk (USA).nds' --locale pt-BR --outdir translations/sprites/pt-BR/art
          if ($LASTEXITCODE -ne 0) { throw 'Original palette bitmap proof failed for PT-BR' }
          python tools/dusk_native_menu_bitmap_proof.py --rom 'Digimon World - Dusk (USA).nds' --locale es-ES --outdir translations/sprites/es-ES/art
          if ($LASTEXITCODE -ne 0) { throw 'Original palette bitmap proof failed for Spanish' }
      - name: Generate genuine translated Nitro sprite graphics and test ROM relocation
        shell: pwsh
        run: |
          python tools/generate_dusk_sprite_header.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Translated sprite generation failed' }
          New-Item -ItemType Directory -Force .private | Out-Null
          clang++ -std=c++20 -O2 -Itools/native-ui tests/sprite_ui_runtime_probe.cpp -o .private/sprite-ui-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Sprite localization runtime build failed' }
          & .private/sprite-ui-probe.exe 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Original ROM sprite integration test failed' }

  research-localization:
    if: inputs.research_only == true && inputs.sprite_scan_only != true
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and inspect MSG.PAK resource offsets
        shell: pwsh
        run: |
          python tools/probe_dusk_strings.py --rom 'Digimon World - Dusk (USA).nds' --out .private/dusk-msgpak-report.json
          if ($LASTEXITCODE -ne 0) { throw 'MSG.PAK probe failed' }
      - name: Discover frequently accessible in-game message IDs
        shell: pwsh
        run: |
          python tools/find_dusk_common_text.py --rom 'Digimon World - Dusk (USA).nds' --limit 35 --inspect 124:45,125:33,70:31,70:32,70:33,70:34,71:19,66:90,69:67,69:35,72:26,64:88,63:36,67:49,67:52,67:55,61:18,61:21,61:24
          if ($LASTEXITCODE -ne 0) { throw 'Failed to discover common text' }
      - name: Map shop and system menus across all ROM resources
        shell: pwsh
        run: |
          python tools/research_dusk_ui_sources.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to scan text origins' }
      - name: Classify DS-encoded menu labels outside the message pack
        shell: pwsh
        run: |
          python tools/research_dusk_ui_encoding.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to locate UI data' }
      - name: Inspect ARM9 shop and main menu string boundaries
        shell: pwsh
        run: |
          python tools/probe_dusk_arm9_ui.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'ARM9 menu source inspection failed' }
      - name: Validate generated language catalogs and source synchrony
        shell: pwsh
        run: |
          python tools/generate_dusk_msgpak_header.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Stale or invalid translation catalog' }
          python tools/generate_dusk_arm9_header.py --check
          python tools/generate_dusk_graphics_header.py --rom 'Digimon World - Dusk (USA).nds' --check
          if ($LASTEXITCODE -ne 0) { throw 'Stale or malformed game-native graphic assets' }
          if ($LASTEXITCODE -ne 0) { throw 'Stale or invalid ARM9 UI catalog' }
      - name: Inventory graphics, palettes and font containers for localization
        shell: pwsh
        run: |
          python tools/research_dusk_graphics.py --rom 'Digimon World - Dusk (USA).nds' --out .private/dusk-graphics-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Graphics inventory failed' }
      - name: Locate Nitro background assets for untranslated menus
        shell: pwsh
        run: |
          python tools/research_dusk_tile_names.py --rom 'Digimon World - Dusk (USA).nds'
          python tools/localization_coverage.py --rom 'Digimon World - Dusk (USA).nds' --out .private/locale-coverage.json
          if ($LASTEXITCODE -ne 0) { throw 'Localization coverage audit failed' }
      - name: Preview original menu and shop tilemaps without patching
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python tools/nitro_bg_preview.py --rom 'Digimon World - Dusk (USA).nds' --base dat/bg/mshp00
          python tools/nitro_bg_preview.py --rom 'Digimon World - Dusk (USA).nds' --base dat/bg/mtsin_bt00
          python tools/nitro_bg_preview.py --rom 'Digimon World - Dusk (USA).nds' --base dat/bg/m_win_00 --tiles
          python tools/nitro_bg_preview.py --rom 'Digimon World - Dusk (USA).nds' --base dat/bg/m_win_01 --tiles
          python tools/nitro_bg_preview.py --rom 'Digimon World - Dusk (USA).nds' --base dat/bg/m_win_2 --tiles
      - name: Identify all baked-in menu labels from tiled backgrounds
        shell: pwsh
        run: |
          python tools/nitro_bg_contact_sheet.py --rom 'Digimon World - Dusk (USA).nds' --prefix dat/bg/m --start 48 --count 24
          if ($LASTEXITCODE -ne 0) { throw 'Original graphical UI research failed' }
      - name: Detect precise menu text IDs in compressed Nintendo DS files
        shell: pwsh
        run: |
          python tools/research_dusk_menu_strings.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'NitroFS option search failed' }
      - name: Diagnose sprite-backed menu button resources
        shell: pwsh
        run: |
          python tools/probe_dusk_sprite_paks.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Sprite research failed' }
      - name: Decode original UI sprite artwork sheets for localization
        shell: pwsh
        run: |
          python tools/probe_dusk_sprites_visual.py --rom 'Digimon World - Dusk (USA).nds' --index
          python tools/probe_dusk_sprites_visual.py --rom 'Digimon World - Dusk (USA).nds' --begin 0 --count 60 --min-pixels 2048 --max-pixels 16384
          python tools/probe_dusk_sprites_visual.py --rom 'Digimon World - Dusk (USA).nds' --begin 60 --count 60 --min-pixels 2048 --max-pixels 16384
          if ($LASTEXITCODE -ne 0) { throw 'Failed sprite UI visual analysis' }
      - name: Compile and run live-resource relocation assertions (no ROM export)
        shell: pwsh
        run: |
          clang++ -std=c++20 -O2 -Itools/native-ui tests/msgpak_runtime_probe.cpp -o .private/msgpak-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'MSG.PAK C++ test compilation failed' }
          & .private/msgpak-probe.exe 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'MSG.PAK RAM relocation proof failed' }
      - name: Verify in-memory ARM9 UI data-only patches
        shell: pwsh
        run: |
          clang++ -std=c++20 -O2 -Itools/native-ui tests/arm9_ui_runtime_probe.cpp -o .private/arm9-ui-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'ARM9 UI probe failed to compile' }
          & .private/arm9-ui-probe.exe 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'ARM9 UI data patch validation failed' }

      - name: Verify native graphics CRCs and no-op resource fallback
        shell: pwsh
        run: |
          clang++ -std=c++20 -O2 -Itools/native-ui tests/nitro_graphics_runtime_probe.cpp -o .private/nitro-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Nitro graphics code failed to compile' }
          & .private/nitro-probe.exe 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Nitro graphics resource guard failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: dusk-msgpak-structure-only
          path: .private/dusk-msgpak-report.json
          retention-days: 7

  build-dusk-native-game:
    if: inputs.approve_game_bundle == true && inputs.fast_repack != true && inputs.research_only != true
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Cache is a build accelerator only; original ROM and save never enter it.
      CCACHE_DIR: ${{ github.workspace }}/.cache/dusk-native-ccache
      CCACHE_MAXSIZE: 1536M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      RELEASE_FILENAME: Digimon-World-Dusk-Recompiled-v0.29-Windows.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate exact game identity and document source revision
        shell: pwsh
        run: |
          $rom = 'Digimon World - Dusk (USA).nds'
          if (!(Test-Path -LiteralPath $rom)) { throw 'Dusk game ROM absent from this checkout' }
          $hash = (Get-FileHash -LiteralPath $rom -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'df9522e07be99c5622e0211d3a50132776784db3fb28f42fc7392f588e1ae8cb') {
            throw "ROM checksum mismatch: $hash"
          }
          $size = (Get-Item -LiteralPath $rom).Length
          if ($size -ne 67108864) { throw "ROM size mismatch: $size" }
          Write-Host "Verified original Dusk USA ROM hash and size; game build revision: $env:GITHUB_SHA"
      - name: Set up pinned MSYS2 UCRT64 compiler, SDL3 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ccache
      - name: Restore C/C++ compiler objects from preceding builds
        id: native-ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/dusk-native-ccache
          # A unique save key per run means newly compiled UI objects are kept.
          # ccache internally fingerprints compiler flags and included headers;
          # a UI-only edit does not invalidate all unchanged game banks.
          key: dusk-ucrt64-objects-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dusk-ucrt64-objects-v2-${{ github.ref_name }}-
            dusk-ucrt64-objects-v2-
            dusk-native-windows-ucrt64-ccache-v1-
      - name: Verify compiler cache and reset hit/miss statistics
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v ccache
          mkdir -p .cache/dusk-native-ccache
          ccache --set-config=max_size=1536M
          ccache --zero-stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and validate approved cross-platform icon assets
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Pillow install failed' }
          python tools/generate_icons.py
          python tools/generate_splash.py
          python -m unittest discover -s tests -p test_splash_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          python -m unittest discover -s tests -p test_icon_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Icon verification failed' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Generate native sprite-menu localization from authenticated cartridge
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python tools/dusk_native_menu_bitmap_proof.py --rom 'Digimon World - Dusk (USA).nds' --locale pt-BR --outdir translations/sprites/pt-BR/art --no-preview
          if ($LASTEXITCODE -ne 0) { throw 'PT-BR custom Nintendo sprite artwork failed' }
          python tools/dusk_native_menu_bitmap_proof.py --rom 'Digimon World - Dusk (USA).nds' --locale es-ES --outdir translations/sprites/es-ES/art --no-preview
          if ($LASTEXITCODE -ne 0) { throw 'Spanish custom Nintendo sprite artwork failed' }
          python tools/generate_dusk_sprite_header.py --rom 'Digimon World - Dusk (USA).nds'
          if ($LASTEXITCODE -ne 0) { throw 'Sprite translation catalog generation failed' }
      - name: Validate localization catalogs before compiling the game
        shell: pwsh
        run: |
          python tools/generate_dusk_msgpak_header.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Stale or invalid locale resources' }
          python tools/generate_dusk_arm9_header.py --check
          python tools/generate_dusk_graphics_header.py --rom 'Digimon World - Dusk (USA).nds' --check
          if ($LASTEXITCODE -ne 0) { throw 'Stale or malformed game-native graphic assets' }
          if ($LASTEXITCODE -ne 0) { throw 'Stale or invalid ARM9 resources' }
      - name: Checkout pinned NDSRecomp and recomp-ui
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          # Both the pinned upstream sources and unified diffs must remain LF.
          # Windows Git's automatic CRLF conversion prevents git apply.
          find tools/patches -name '*.patch' -exec sed -i 's/\r$//' {} +
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream config core.autocrlf false
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui config core.autocrlf false
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
          python tools/apply_dusk_patches.py --upstream upstream --component desktop
          cp tools/native-ui/dusk_modern_ui.hpp upstream/runner/src/dusk_modern_ui.hpp
          cp tools/native-ui/dusk_material_renderer.hpp upstream/runner/src/dusk_material_renderer.hpp
          cp tools/native-ui/dusk_ui_font.hpp upstream/runner/src/dusk_ui_font.hpp
          cp tools/native-ui/dusk_localization.hpp upstream/runner/src/dusk_localization.hpp
          cp tools/native-ui/dusk_msgpak_runtime.hpp upstream/runner/src/dusk_msgpak_runtime.hpp
          cp tools/native-ui/dusk_msgpak_catalog.generated.hpp upstream/runner/src/dusk_msgpak_catalog.generated.hpp
          cp tools/native-ui/dusk_arm9_runtime.hpp upstream/runner/src/dusk_arm9_runtime.hpp
          cp tools/native-ui/dusk_arm9_catalog.generated.hpp upstream/runner/src/dusk_arm9_catalog.generated.hpp
          cp tools/native-ui/dusk_graphics_runtime.hpp upstream/runner/src/dusk_graphics_runtime.hpp
          cp tools/native-ui/dusk_graphics_catalog.generated.hpp upstream/runner/src/dusk_graphics_catalog.generated.hpp
          cp tools/native-ui/dusk_sprite_runtime.hpp upstream/runner/src/dusk_sprite_runtime.hpp
          cp tools/native-ui/dusk_sprite_catalog.generated.hpp upstream/runner/src/dusk_sprite_catalog.generated.hpp
          cp tools/native-ui/dusk_font_atlas.hpp upstream/runner/src/dusk_font_atlas.hpp
          git -C upstream apply ../tools/patches/ndsrecomp-freebios-diagnostic.patch
          git -C upstream apply ../tools/patches/ndsrecomp-libslirp-win32.patch
          git -C upstream apply ../tools/patches/ndsrecomp-tftp-win32.patch
          python tools/patch_windows_net.py upstream
      - name: Compile native ARM static recompiler
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
          ./upstream/recompiler/build/nds_recompile.exe --codegen-identity
      - name: Recompile FreeBIOS and the original Dusk ARM9/ARM7 banks
        shell: msys2 {0}
        run: |
          set -euo pipefail
          recomp=./upstream/recompiler/build/nds_recompile.exe
          mkdir -p upstream/generated
          "$recomp" --config upstream/bios/freebios9.toml --bin upstream/third_party/freebios/drastic_bios_arm9.bin --out upstream/generated --bank freebios_arm9
          "$recomp" --config upstream/bios/freebios7.toml --bin upstream/third_party/freebios/drastic_bios_arm7.bin --out upstream/generated --bank freebios_arm7
          # v0.17 mistakenly compiled only the two main ARM banks, losing
          # the v0.16 battle/scene overlays. Preserve the original verified
          # page generations and restore only full-page checksum-matched PCs.
          python tools/prepare_dusk_recomp.py \
            --rom 'Digimon World - Dusk (USA).nds' \
            --out .private/recomp --overlays
          python tools/restore_verified_hotpaths.py \
            --rom 'Digimon World - Dusk (USA).nds' \
            --stage .private/recomp \
            --evidence tools/evidence/owner-v019-verified-roots-compact.b64 \
            --extra-evidence tools/evidence/owner-v019-arm7-root-supplement.b64 \
            --recompiler upstream/recompiler/build/nds_recompile.exe
          test -f .private/recomp/generated/dusk_arm9_main_dispatch.c
          test -f .private/recomp/generated/dusk_arm7_main_dispatch.c
          grep -q '\[\[code_copy\]\]' .private/recomp/dusk_arm7_main.toml
          test -f .private/recomp/generated/dusk_arm9_ovl00_dispatch.c
          test -f .private/recomp/generated/dusk_arm9_ovl07_dispatch.c
          test -f .private/recomp/generated/dusk_arm9_ovl09_dispatch.c
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.verified_dispatch_rows import read_dispatch_rows
          generated = Path('.private/recomp/generated')
          rows = {}
          for cpu, bank in ((9, 'dusk_arm9_main'), (7, 'dusk_arm7_main')):
              count = len(read_dispatch_rows(
                  [generated / (bank + '_dispatch.c')], expected_cpu=cpu))
              print(f'Validated native {bank} entries:', count)
              rows[cpu] = count
          # This is intentionally a Windows *experimental* playtest gate.
          # Actual v0.15 native AOT counts were 65,097 ARM9 and 12,199 ARM7.
          # This build restores ARM9 beyond that baseline, but ARM7 still
          # falls short. Do not claim v0.16 parity or merge on this basis.
          if rows[9] < 65097 or rows[7] < 7300:
              raise SystemExit('Native AOT below experimentally measured candidate minimum')
          if rows[7] < 12199:
              print('WARNING: ARM7 v0.16 parity NOT achieved; candidate playtest only')
          Path('.private/recomp/dispatch-coverage.json').write_text(
              json.dumps({'arm9_main_rows': rows[9],
                          'arm7_main_rows': rows[7],
                          'baseline_v015_arm9': 65097,
                          'baseline_v015_arm7': 12199,
                          'v016_arm7_parity': rows[7] >= 12199,
                          'status': 'owner-playtest-only'}, indent=2) + '\\n')
          PY
      - name: Build Windows x64 SDL3 native runner from original code
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S upstream/runner -B upstream/runner/build-owner-dusk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DNDS_SDL_BACKEND=SDL3 \
            -DNDS_ENABLE_COMPUTE_RENDERER=OFF \
            -DNDS_DIAGNOSTIC_FREEBIOS_ONLY=ON \
            -DNDS_BOOTSTRAP_FIRMWARE=ON \
            -DNDS_RECOMP_UI_ROOT="$PWD/recomp-ui" \
            -DNDS_TITLE_BANK_DIR="$PWD/.private/recomp/generated" \
            -DNDS_TITLE_ROM_SHA1=de1a1915e07288ffad654f3f9f2eb730a0fd1d9c
          # A GitHub-hosted Windows runner has bounded memory. Three
          # compilers are a conservative initial improvement over two;
          # revisit after reviewing cache stats and peak memory.
          cmake --build upstream/runner/build-owner-dusk --target nds_runner --parallel 3
          test -f upstream/runner/build-owner-dusk/nds_runner.exe
          test -f /ucrt64/bin/SDL3.dll
      # Preserve compiled C/C++ objects as soon as the expensive native
      # runner succeeds. Previously this was AFTER Go launcher checks, PE
      # packaging, artifact upload and their possible failures: a transient
      # packaging failure discarded ~20 minutes of compiler results.
      - name: Show cold/warm compiler cache hit rate
        if: success()
        shell: msys2 {0}
        run: |
          ccache --show-stats
          ccache --show-stats --format=json > .private/ccache-stats.json
      - name: Persist compiled Windows game objects before packaging
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/dusk-native-ccache
          key: ${{ steps.native-ccache.outputs.cache-primary-key }}
      - name: Verify native runner and build one-click GUI EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, .private/staging | Out-Null
          $windres = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/windres.exe'
          if (!(Test-Path -LiteralPath $windres)) { throw 'MinGW windres not found' }
          & $windres -i assets/icons/generated/windows/dusk.rc -O coff -o native-launcher/desktop/dusk_icon_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher icon resource compilation failed' }
          Push-Location native-launcher/desktop
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Launcher unit tests failed' }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../.private/staging/dusk-launcher.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI launcher build failed' }
          Pop-Location
          $runner = 'upstream/runner/build-owner-dusk/nds_runner.exe'
          $sdl = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/SDL3.dll'
          $iconv = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/libiconv-2.dll'
          if (!(Test-Path $runner) -or !(Test-Path $sdl) -or !(Test-Path $iconv)) {
            throw 'NDSRecomp SDL3 executable or matching SDL3.dll missing'
          }
          $objdump = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/objdump.exe'
          if (!(Test-Path $objdump)) { throw 'Windows PE import auditor missing' }
          foreach ($binary in @($runner, $sdl, $iconv)) {
            $imports = ((& $objdump -p $binary | Select-String 'DLL Name:' | ForEach-Object { $_.Line }) -join "`n")
            Write-Host "Windows PE imports for $binary"
            Write-Host $imports
            if ($imports -match 'libstdc\\+\\+|libgcc_s|libwinpthread|msys-2\\.0|libintl') {
              throw "Game runtime unexpectedly requires nonbundled development DLLs: $binary"
            }
          }
          python tools/pack_native_private.py --launcher .private/staging/dusk-launcher.exe --runner $runner --sdl $sdl --iconv $iconv --window-icon assets/icons/generated/windows/window-icon.rgba --splash assets/splash/generated/dusk-splash.bmp --rom 'Digimon World - Dusk (USA).nds' --output "dist/$env:RELEASE_FILENAME"
          if ($LASTEXITCODE -ne 0) { throw 'Owner one-click EXE packing failed' }
          $exe = (Resolve-Path "dist/$env:RELEASE_FILENAME").Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Windows GUI one-click bundle verification failed' }
          $meta = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($meta.ProductName -ne 'Digimon World Dusk Recompiled' -or
              $meta.FileDescription -ne 'Digimon World Dusk Recompiled' -or
              $meta.ProductVersion -ne 'v0.29') {
            throw "Windows PE branding incorrect: $($meta.ProductName) / $($meta.FileDescription) / $($meta.ProductVersion)"
          }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $env:RELEASE_FILENAME" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          "Digimon World Dusk Recompiled v0.29 - Recompiled by Tblack. 4K Lunamon splash with five-second hold and host-only 800ms crossfade, verified SDL3 icon and original game presentation. Source: $env:GITHUB_SHA. ARM9/ARM7 page-verified dispatch, safe overlay AOT and fallback Tier3 unchanged. EEPROM stays in %LOCALAPPDATA%/DuskNativePC/userdata/A6RE/saves/dusk.sav. Shift + double click opens save management. This is an owner playtest build; full-campaign compatibility is not certified." | Set-Content -Encoding utf8 dist/README-PLAYTEST.txt
          Get-ChildItem dist | Select-Object Name, Length
      - name: Publish standalone Windows EXE (direct download, never zip)
        if: inputs.direct_exe_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "dist/$env:RELEASE_FILENAME"
          if (!(Test-Path -LiteralPath $asset)) { throw 'No verified standalone EXE exists' }
          $tag = "l10n-playtest-$env:GITHUB_RUN_ID"
          gh release create $tag $asset --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Dusk Localization Playtest $env:GITHUB_RUN_NUMBER" --notes "Experimental localization work from PR #27. Standalone Windows x64 executable. Original verified game bundle and saves preserved. This is not yet a certified 100% translation." --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed publishing direct EXE to prerelease' }
          Write-Host "DIRECT_EXE=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$env:RELEASE_FILENAME"
      - name: Upload actual Windows game with original ROM and SDL3
        uses: actions/upload-artifact@v4
        with:
          name: Digimon-World-Dusk-Recompiled-v0.29-Windows-NATIVE-GAME
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  fast-cosmetic-repack:
    if: inputs.approve_game_bundle == true && inputs.fast_repack == true && inputs.research_only != true
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-binutils
      - name: Refuse repack if native runner inputs changed
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_native_runtime_pin.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Runtime provenance tests failed' }
          python tools/native_runtime_pin.py
          if ($LASTEXITCODE -ne 0) { throw 'Native patch identity changed; full build required' }
      - name: Retrieve SHA-pinned validated Windows game
        shell: pwsh
        run: |
          $pin = Get-Content tools/native-windows-runtime-pin.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force .private/prior | Out-Null
          gh run download $pin.run_id --repo EwertonMendes/digimon-world-dusk-pc --name $pin.artifact_name --dir .private/prior
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native artifact download failed' }
          $artifacts = gh api "repos/EwertonMendes/digimon-world-dusk-pc/actions/runs/$($pin.run_id)/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify immutable GitHub artifact' }
          $matching = @($artifacts.artifacts | Where-Object { $_.id -eq $pin.artifact_id -and $_.name -eq $pin.artifact_name -and $_.digest -eq $pin.artifact_digest -and !$_.expired })
          if ($matching.Count -ne 1) { throw 'Source artifact ID/digest is not the pinned native build' }
          $source = Join-Path '.private/prior' $pin.exe_filename
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          python tools/repack_verified_native_windows.py --exe $source --out .private/verified-runtime --sha256 $sourceHash
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runner or ROM failed SHA-256 verification' }
      - name: Generate approved icons and splash without ARM recompilation
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Pillow unavailable' }
          python tools/generate_icons.py
          python tools/generate_splash.py
          python -m unittest discover -s tests -p test_icon_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Icon validation failed' }
          python -m unittest discover -s tests -p test_splash_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Splash validation failed' }
      - name: Rebuild only GUI launcher and package existing game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, .private/staging | Out-Null
          $windres = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/windres.exe'
          & $windres -i assets/icons/generated/windows/dusk.rc -O coff -o native-launcher/desktop/dusk_icon_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'PE icon resource build failed' }
          Push-Location native-launcher/desktop
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../.private/staging/dusk-launcher.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          Pop-Location
          $name = (python -c 'import sys;sys.path.insert(0,"tools");from branding import WINDOWS_EXE;print(WINDOWS_EXE)').Trim()
          python tools/pack_native_private.py --launcher .private/staging/dusk-launcher.exe --runner .private/verified-runtime/runner.exe --sdl .private/verified-runtime/SDL3.dll --iconv .private/verified-runtime/libiconv-2.dll --window-icon assets/icons/generated/windows/window-icon.rgba --splash assets/splash/generated/dusk-splash.bmp --rom .private/verified-runtime/game.nds --output "dist/$name"
          if ($LASTEXITCODE -ne 0) { throw 'Private EXE packaging failed' }
          $exe = (Resolve-Path "dist/$name").Path
          $verified = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -Wait -PassThru
          if ($verified.ExitCode -ne 0) { throw 'Built EXE failed private integrity check' }
          $meta = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $version = (python -c 'import sys;sys.path.insert(0,"tools");from branding import APP_VERSION;print(APP_VERSION)').Trim()
          if ($meta.ProductName -ne 'Digimon World Dusk Recompiled' -or $meta.ProductVersion -ne $version) {
            throw 'Wrong Windows version/product identity'
          }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          "Fast cosmetic repack - $name - Original native runner and original ROM reused byte-for-byte. No ARM recompilation. Press P to pause/resume the 5-second splash." | Set-Content -Encoding utf8 dist/README-PLAYTEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Digimon-World-Dusk-Recompiled-Windows-FAST-GAME
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
