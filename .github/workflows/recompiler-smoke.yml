name: NDSRecomp upstream recompiler smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/bootstrap_recompiler.py'
      - '.github/workflows/recompiler-smoke.yml'
permissions:
  contents: read

jobs:
  upstream-recompiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact audited upstream revision (no ROM or BIOS)
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
          git -C upstream rev-parse HEAD
      - name: Compile standalone recompiler
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --parallel 2
      - name: Run upstream ARM decode and interpreter cycle tests
        run: |
          ./upstream/recompiler/build/armv5te_decode_test
          ./upstream/recompiler/build/interpreter_cycle_test
