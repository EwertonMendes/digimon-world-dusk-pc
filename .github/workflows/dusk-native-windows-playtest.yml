name: Dusk native Windows game (owner playtest)
on:
  workflow_dispatch:
    inputs:
      approve_game_bundle:
        description: 'I authorize packaging the uploaded ROM into a downloadable Windows EXE'
        required: true
        type: boolean
        default: false
      fast_repack:
        description: 'Fast launcher-only repack (pinned to v0.20; unavailable when appVersion differs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Do not let a fast launcher-only repack interrupt a full game build.
  group: dusk-native-owner-playtest-${{ github.ref }}-${{ inputs.fast_repack }}
  cancel-in-progress: true

jobs:
  build-dusk-native-game:
    if: inputs.approve_game_bundle == true && inputs.fast_repack != true
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Cache is a build accelerator only; original ROM and save never enter it.
      CCACHE_DIR: ${{ github.workspace }}/.cache/dusk-native-ccache
      CCACHE_MAXSIZE: 1536M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate exact game identity and document source revision
        shell: pwsh
        run: |
          $rom = 'Digimon World - Dusk (USA).nds'
          if (!(Test-Path -LiteralPath $rom)) { throw 'Dusk game ROM absent from this checkout' }
          $hash = (Get-FileHash -LiteralPath $rom -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'df9522e07be99c5622e0211d3a50132776784db3fb28f42fc7392f588e1ae8cb') {
            throw "ROM checksum mismatch: $hash"
          }
          $size = (Get-Item -LiteralPath $rom).Length
          if ($size -ne 67108864) { throw "ROM size mismatch: $size" }
          Write-Host "Verified original Dusk USA ROM hash and size; game build revision: $env:GITHUB_SHA"
      - name: Set up pinned MSYS2 UCRT64 compiler, SDL3 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ccache
      - name: Restore C/C++ compiler objects from preceding builds
        id: native-ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/dusk-native-ccache
          key: dusk-native-windows-ucrt64-ccache-v1-${{ hashFiles('tools/patches/*.patch', 'tools/evidence/*.b64', 'tools/restore_verified_hotpaths.py', 'tools/prepare_dusk_recomp.py', 'tools/patch_windows_net.py') }}
          restore-keys: |
            dusk-native-windows-ucrt64-ccache-v1-
      - name: Verify compiler cache and reset hit/miss statistics
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v ccache
          mkdir -p .cache/dusk-native-ccache
          ccache --set-config=max_size=1536M
          ccache --zero-stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and validate approved cross-platform icon assets
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Pillow install failed' }
          python tools/generate_icons.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          python -m unittest discover -s tests -p test_icon_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Icon verification failed' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Checkout pinned NDSRecomp and recomp-ui
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          # Both the pinned upstream sources and unified diffs must remain LF.
          # Windows Git's automatic CRLF conversion prevents git apply.
          find tools/patches -name '*.patch' -exec sed -i 's/\r$//' {} +
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream config core.autocrlf false
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui config core.autocrlf false
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
          python tools/apply_dusk_patches.py --upstream upstream --component desktop
          git -C upstream apply ../tools/patches/ndsrecomp-freebios-diagnostic.patch
          git -C upstream apply ../tools/patches/ndsrecomp-libslirp-win32.patch
          git -C upstream apply ../tools/patches/ndsrecomp-tftp-win32.patch
          python tools/patch_windows_net.py upstream
      - name: Compile native ARM static recompiler
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
          ./upstream/recompiler/build/nds_recompile.exe --codegen-identity
      - name: Recompile FreeBIOS and the original Dusk ARM9/ARM7 banks
        shell: msys2 {0}
        run: |
          set -euo pipefail
          recomp=./upstream/recompiler/build/nds_recompile.exe
          mkdir -p upstream/generated
          "$recomp" --config upstream/bios/freebios9.toml --bin upstream/third_party/freebios/drastic_bios_arm9.bin --out upstream/generated --bank freebios_arm9
          "$recomp" --config upstream/bios/freebios7.toml --bin upstream/third_party/freebios/drastic_bios_arm7.bin --out upstream/generated --bank freebios_arm7
          # v0.17 mistakenly compiled only the two main ARM banks, losing
          # the v0.16 battle/scene overlays. Preserve the original verified
          # page generations and restore only full-page checksum-matched PCs.
          python tools/prepare_dusk_recomp.py \
            --rom 'Digimon World - Dusk (USA).nds' \
            --out .private/recomp --overlays
          python tools/restore_verified_hotpaths.py \
            --rom 'Digimon World - Dusk (USA).nds' \
            --stage .private/recomp \
            --evidence tools/evidence/owner-v019-verified-roots-compact.b64 \
            --extra-evidence tools/evidence/owner-v019-arm7-root-supplement.b64 \
            --recompiler upstream/recompiler/build/nds_recompile.exe
          test -f .private/recomp/generated/dusk_arm9_main_dispatch.c
          test -f .private/recomp/generated/dusk_arm7_main_dispatch.c
          grep -q '\[\[code_copy\]\]' .private/recomp/dusk_arm7_main.toml
          test -f .private/recomp/generated/dusk_arm9_ovl00_dispatch.c
          test -f .private/recomp/generated/dusk_arm9_ovl07_dispatch.c
          test -f .private/recomp/generated/dusk_arm9_ovl09_dispatch.c
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.verified_dispatch_rows import read_dispatch_rows
          generated = Path('.private/recomp/generated')
          rows = {}
          for cpu, bank in ((9, 'dusk_arm9_main'), (7, 'dusk_arm7_main')):
              count = len(read_dispatch_rows(
                  [generated / (bank + '_dispatch.c')], expected_cpu=cpu))
              print(f'Validated native {bank} entries:', count)
              rows[cpu] = count
          # This is intentionally a Windows *experimental* playtest gate.
          # Actual v0.15 native AOT counts were 65,097 ARM9 and 12,199 ARM7.
          # This build restores ARM9 beyond that baseline, but ARM7 still
          # falls short. Do not claim v0.16 parity or merge on this basis.
          if rows[9] < 65097 or rows[7] < 7300:
              raise SystemExit('Native AOT below experimentally measured candidate minimum')
          if rows[7] < 12199:
              print('WARNING: ARM7 v0.16 parity NOT achieved; candidate playtest only')
          Path('.private/recomp/dispatch-coverage.json').write_text(
              json.dumps({'arm9_main_rows': rows[9],
                          'arm7_main_rows': rows[7],
                          'baseline_v015_arm9': 65097,
                          'baseline_v015_arm7': 12199,
                          'v016_arm7_parity': rows[7] >= 12199,
                          'status': 'owner-playtest-only'}, indent=2) + '\\n')
          PY
      - name: Build Windows x64 SDL3 native runner from original code
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S upstream/runner -B upstream/runner/build-owner-dusk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DNDS_SDL_BACKEND=SDL3 \
            -DNDS_ENABLE_COMPUTE_RENDERER=OFF \
            -DNDS_DIAGNOSTIC_FREEBIOS_ONLY=ON \
            -DNDS_BOOTSTRAP_FIRMWARE=ON \
            -DNDS_RECOMP_UI_ROOT="$PWD/recomp-ui" \
            -DNDS_TITLE_BANK_DIR="$PWD/.private/recomp/generated" \
            -DNDS_TITLE_ROM_SHA1=de1a1915e07288ffad654f3f9f2eb730a0fd1d9c
          # A GitHub-hosted Windows runner has bounded memory. Three
          # compilers are a conservative initial improvement over two;
          # revisit after reviewing cache stats and peak memory.
          cmake --build upstream/runner/build-owner-dusk --target nds_runner --parallel 3
          test -f upstream/runner/build-owner-dusk/nds_runner.exe
          test -f /ucrt64/bin/SDL3.dll
      # Preserve compiled C/C++ objects as soon as the expensive native
      # runner succeeds. Previously this was AFTER Go launcher checks, PE
      # packaging, artifact upload and their possible failures: a transient
      # packaging failure discarded ~20 minutes of compiler results.
      - name: Show cold/warm compiler cache hit rate
        if: success()
        shell: msys2 {0}
        run: |
          ccache --show-stats
      - name: Persist compiled Windows game objects before packaging
        if: success() && steps.native-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/dusk-native-ccache
          key: ${{ steps.native-ccache.outputs.cache-primary-key }}
      - name: Verify native runner and build one-click GUI EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, .private/staging | Out-Null
          $windres = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/windres.exe'
          if (!(Test-Path -LiteralPath $windres)) { throw 'MinGW windres not found' }
          & $windres -i assets/icons/generated/windows/dusk.rc -O coff -o native-launcher/desktop/dusk_icon_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher icon resource compilation failed' }
          Push-Location native-launcher/desktop
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Launcher unit tests failed' }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../.private/staging/dusk-launcher.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI launcher build failed' }
          Pop-Location
          $runner = 'upstream/runner/build-owner-dusk/nds_runner.exe'
          $sdl = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/SDL3.dll'
          $iconv = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/libiconv-2.dll'
          if (!(Test-Path $runner) -or !(Test-Path $sdl) -or !(Test-Path $iconv)) {
            throw 'NDSRecomp SDL3 executable or matching SDL3.dll missing'
          }
          $objdump = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/objdump.exe'
          if (!(Test-Path $objdump)) { throw 'Windows PE import auditor missing' }
          foreach ($binary in @($runner, $sdl, $iconv)) {
            $imports = ((& $objdump -p $binary | Select-String 'DLL Name:' | ForEach-Object { $_.Line }) -join "`n")
            Write-Host "Windows PE imports for $binary"
            Write-Host $imports
            if ($imports -match 'libstdc\\+\\+|libgcc_s|libwinpthread|msys-2\\.0|libintl') {
              throw "Game runtime unexpectedly requires nonbundled development DLLs: $binary"
            }
          }
          python tools/pack_native_private.py --launcher .private/staging/dusk-launcher.exe --runner $runner --sdl $sdl --iconv $iconv --window-icon assets/icons/generated/windows/window-icon.rgba --rom 'Digimon World - Dusk (USA).nds' --output dist/Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON.exe
          if ($LASTEXITCODE -ne 0) { throw 'Owner one-click EXE packing failed' }
          $exe = (Resolve-Path dist/Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON.exe).Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Windows GUI one-click bundle verification failed' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          "Dusk PC v0.23 transparent icon + precise frame pacing owner playtest (audio queue/cadence/SPU unchanged)`nSource: $env:GITHUB_SHA`nIncludes page-verified ARM9/ARM7 (including relocated ARM7 code), guarded overlay AOT, and FreeBIOS. Audio runway target 188 ms. Uncovered code still uses Tier3 fallback.`nFull-campaign compatibility is not established.`nCartridge EEPROM remains at %LOCALAPPDATA%/DuskNativePC/userdata/A6RE/saves/dusk.sav`nShift + double click: manage save backups." | Set-Content -Encoding utf8 dist/README-PLAYTEST.txt
          Get-ChildItem dist | Select-Object Name, Length
      - name: Upload actual Windows game with original ROM and SDL3
        uses: actions/upload-artifact@v4
        with:
          name: Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-NATIVE-GAME
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  repackage-validated-native:
    if: inputs.approve_game_bundle == true && inputs.fast_repack == true
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-binutils
      - name: Generate checked Windows icon assets
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          python tools/generate_icons.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          python -m unittest discover -s tests -p test_icon_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Icon validation failed' }
          python -m unittest discover -s tests -p test_private_packer_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Private packer tests failed' }
      - name: Require v0.23 launcher and pin native runtime provenance
        shell: pwsh
        run: |
          $source = Get-Content native-launcher/desktop/save_data.go -Raw
          if ($source -notmatch 'appVersion\s*=\s*"v0\.23"') {
            throw 'Fast repack requires v0.23 launcher and the exact validated native runner'
          }
      - name: Retrieve byte-verified v0.23 SDL3 runner and ROM
        shell: pwsh
        run: |
          gh run download 38643954559 --repo EwertonMendes/digimon-world-dusk-pc --name Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-NATIVE-GAME --dir .private/prior
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows native artifact download failed' }
          $exe = '.private/prior/Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON.exe'
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '73c72c6dfea754f716ef8684277daaf15556c8977e9484c9281f226bf81aae45') {
            throw "Wrong original runner bundle SHA256: $sha"
          }
          python tools/repack_verified_native_windows.py --exe $exe --out .private/verified-runtime --sha256 73c72c6dfea754f716ef8684277daaf15556c8977e9484c9281f226bf81aae45
          if ($LASTEXITCODE -ne 0) { throw 'Native game data integrity verification failed' }
      - name: Embed Windows PE icon and build corrected GUI launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .private/staging | Out-Null
          $windres = Join-Path $env:RUNNER_TEMP 'msys64/ucrt64/bin/windres.exe'
          if (!(Test-Path -LiteralPath $windres)) { throw 'MinGW windres is required to embed the PE icon' }
          & $windres -i assets/icons/generated/windows/dusk.rc -O coff -o native-launcher/desktop/dusk_icon_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Windows icon resource generation failed' }
          Push-Location native-launcher/desktop
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher Go tests failed' }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../.private/staging/dusk-launcher.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI launcher compilation failed' }
          Pop-Location
      - name: Repackage, verify and publish real Windows v0.23 EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python tools/pack_native_private.py --launcher .private/staging/dusk-launcher.exe --runner .private/verified-runtime/runner.exe --sdl .private/verified-runtime/SDL3.dll --iconv .private/verified-runtime/libiconv-2.dll --window-icon assets/icons/generated/windows/window-icon.rgba --rom .private/verified-runtime/game.nds --output dist/Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-FIXED.exe
          if ($LASTEXITCODE -ne 0) { throw 'Failed to package transparent SDL3 icon' }
          $exe = (Resolve-Path dist/Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-FIXED.exe).Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'EXE bundle verification (including required RGBA icon) failed' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-FIXED.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          "Digimon World Dusk PC v0.23: corrected transparent Windows EXE and SDL3 window icon. Native ARM9/ARM7 runner is byte-identical to the validated build 38643954559. EEPROM remains in the stable userdata/A6RE profile. Double click to launch." | Set-Content -Encoding utf8 dist/README-PLAYTEST.txt
          Get-ChildItem dist | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Digimon-Dusk-PC-Windows-v0.23-TRANSPARENT-ICON-FIXED-NATIVE-GAME
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
