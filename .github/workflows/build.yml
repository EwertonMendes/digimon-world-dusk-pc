name: Build and test - ROM free
on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} native prototype
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUSK_BUILD_TESTS=ON
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'
      - name: Install pinned icon-generation dependency
        if: runner.os == 'Linux'
        run: python -m pip install Pillow==11.3.0
      - name: Validate Python research tooling syntax
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests -p test_icon_assets.py -v
          python3 -m py_compile tools/test_dusk_native_story.py tools/dusk_gameplay_scenarios.py tools/prepare_dusk_recomp.py tools/analyze_native_perf.py tools/analyze_v016_sessions.py tools/apply_dusk_patches.py tools/verified_dispatch_rows.py tools/pack_native_private.py
          python3 -m unittest discover -s tests -p test_native_perf.py -v
          python3 -m unittest discover -s tests -p test_v016_diagnostics.py -v
          python3 -m unittest discover -s tests -p test_apply_dusk_patches.py -v
          python3 -m unittest discover -s tests -p test_verified_aot.py -v
          python3 - <<'PY'
          import base64, json, pathlib, zlib
          path=pathlib.Path('tools/evidence/owner-v019-verified-roots-compact.b64')
          obj=json.loads(zlib.decompress(base64.b64decode(path.read_bytes())))
          print('v019 proof schema:',repr(obj.get('s')),'top keys:',sorted(obj))
          print('banks type:',type(obj.get('b')).__name__)
          if isinstance(obj.get('b'),dict):
              print('bank summary:',[(k,len(v), len(v[0]) if v and isinstance(v[0],list) else '?') for k,v in obj['b'].items()])
          print('copies structure:',[(k,len(v)) for k,v in obj.get('c',{}).items()] if isinstance(obj.get('c'),dict) else type(obj.get('c')).__name__)
          PY
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from pathlib import Path
          from restore_verified_hotpaths import load_evidence, merge_safe_supplement
          base=load_evidence(Path('tools/evidence/owner-v019-verified-roots-compact.b64'))
          extra=load_evidence(Path('tools/evidence/owner-v019-arm7-root-supplement.b64'))
          joined=merge_safe_supplement(base,extra)
          count=len(joined['banks']['dusk_arm7_main'])
          print('Owner ARM7 root proof merged without mismatched page generations:',count)
          assert 3500 < count <= 4096
          PY
          python3 -m unittest discover -s tests -p test_restore_verified_hotpaths.py -v
          python3 -m unittest discover -s tests -p test_verified_overlays.py -v
          python3 -m unittest discover -s tests -p test_merge_verified_profiles.py -v
          python3 -m unittest discover -s tests -p test_verified_aot_delta.py -v
          python3 -m unittest discover -s tests -p test_refresh_shipped_overlays.py -v
          python3 -m unittest discover -s tests -p test_promote_tier3_spans.py -v
          python3 -m unittest discover -s tests -p test_verified_dispatch_rows.py -v
          python3 -m unittest discover -s tests -p test_private_packer_gate.py -v
          python3 -m unittest discover -s tests -p test_dusk_gameplay_scenarios.py -v
          python3 -m unittest discover -s tests -p test_dusk_gameplay_save_fixture.py -v
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUSK_BUILD_TESTS=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows executable (presentation prototype, NOT the game)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dusk-pc-windows-presentation-prototype
          path: |
            build/Release/dusk_pc.exe
            build/Release/dusk_rom_info.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux ROM analyzer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dusk-rom-inspector-linux
          path: build/dusk_rom_info
          if-no-files-found: error
          retention-days: 14

  upstream-recompiler:
    name: NDSRecomp decode and cycle tests (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
      - name: Build the standalone upstream recompiler (no game files)
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --parallel 2
      - name: Run ARM instruction and cycle tests
        run: |
          ./upstream/recompiler/build/armv5te_decode_test
          ./upstream/recompiler/build/interpreter_cycle_test
      - name: Package exact public upstream runtime source for offline diagnostics
        shell: bash
        run: |
          tar -cJf upstream-source.tar.xz -C upstream --exclude=.git --exclude=recompiler/build .
      - name: Upload upstream source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ndsrecomp-upstream-source-pinned
          path: upstream-source.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: Package pinned public recomp-ui dependency for offline diagnostics
        shell: bash
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
          tar -cJf recomp-ui-source.tar.xz -C recomp-ui --exclude=.git .
      - name: Upload recomp-ui source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: recomp-ui-upstream-source-pinned
          path: recomp-ui-source.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux native recompiler utility
        uses: actions/upload-artifact@v4
        with:
          name: nds-recompiler-linux-x64
          path: upstream/recompiler/build/nds_recompile
          if-no-files-found: error
          retention-days: 14
      - name: Validate Dusk bank generator against real recompiler with synthetic ARM
        env:
          NDS_RECOMPILER: ./upstream/recompiler/build/nds_recompile
        run: python3 tests/test_recomp_pipeline.py

  upstream-recompiler-windows:
    name: Windows ARM static recompiler toolchain
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NDSRecomp toolchain
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
      - name: Build Windows recompiler
        shell: pwsh
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
      - name: Verify recompiler binary
        shell: pwsh
        run: |
          if (!(Test-Path upstream/recompiler/build/nds_recompile.exe)) { throw "Expected nds_recompile.exe missing" }
          & ./upstream/recompiler/build/nds_recompile.exe --codegen-identity
      - name: Upload native Windows static recompiler utility
        uses: actions/upload-artifact@v4
        with:
          name: nds-recompiler-windows-x64
          path: upstream/recompiler/build/nds_recompile.exe
          if-no-files-found: error
          retention-days: 14

  freebios-headless-windows:
    if: github.event_name == 'workflow_dispatch'
    name: ROM-free Windows native runner feasibility (manual, experimental)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NDSRecomp + apply FreeBIOS-only diagnostic patch
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
          git -C upstream apply ../tools/patches/ndsrecomp-freebios-diagnostic.patch
          if ($LASTEXITCODE -ne 0) { throw 'FreeBIOS patch failed' }
          git -C upstream apply ../tools/patches/ndsrecomp-libslirp-win32.patch
          if ($LASTEXITCODE -ne 0) { throw 'WinSock patch failed' }
          git -C upstream apply ../tools/patches/ndsrecomp-tftp-win32.patch
          if ($LASTEXITCODE -ne 0) { throw 'TFTP patch failed' }
          python tools/patch_windows_net.py upstream
          if ($LASTEXITCODE -ne 0) { throw 'Net_Slirp Win32 guard patch failed' }
          git clone --no-checkout https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          git -C recomp-ui checkout 41c88ffea852b970af8d50312620b17404e455ad
      - name: Build Windows ARM static recompiler
        shell: pwsh
        run: |
          cmake -S upstream/recompiler -B upstream/recompiler/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/recompiler/build --target nds_recompile --parallel 2
      - name: Generate open FreeBIOS code banks
        shell: pwsh
        run: |
          $bin = "./upstream/recompiler/build/nds_recompile.exe"
          & $bin --config upstream/bios/freebios9.toml --bin upstream/third_party/freebios/drastic_bios_arm9.bin --out upstream/generated --bank freebios_arm9
          if ($LASTEXITCODE -ne 0) { throw "FreeBIOS ARM9 failed" }
          & $bin --config upstream/bios/freebios7.toml --bin upstream/third_party/freebios/drastic_bios_arm7.bin --out upstream/generated --bank freebios_arm7
          if ($LASTEXITCODE -ne 0) { throw "FreeBIOS ARM7 failed" }
      - name: Compile ROM-free Windows native hardware runtime
        shell: pwsh
        run: |
          $uiPath = (Resolve-Path ./recomp-ui).Path
          $cmakeArgs = @(
            "-S", "upstream/runner",
            "-B", "upstream/runner/build-windows",
            "-G", "Ninja",
            "-DCMAKE_C_COMPILER=clang",
            "-DCMAKE_CXX_COMPILER=clang++",
            "-DCMAKE_CXX_FLAGS=-DNOMINMAX",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DNDS_SDL_BACKEND=NONE",
            "-DNDS_ENABLE_COMPUTE_RENDERER=OFF",
            "-DNDS_BOOTSTRAP_FIRMWARE=ON",
            "-DNDS_DIAGNOSTIC_FREEBIOS_ONLY=ON",
            "-DNDS_RECOMP_UI_ROOT=$uiPath"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "Runner CMake configure failed" }
          & cmake --build upstream/runner/build-windows --target nds_runner --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Runner compilation failed" }
          if (!(Test-Path upstream/runner/build-windows/nds_runner.exe)) { throw "Windows nds_runner.exe missing" }
      - name: Verify Windows binary exists (no game code)
        shell: pwsh
        run: |
          $output = (Get-Item upstream/runner/build-windows/nds_runner.exe).Length
          Write-Host "Windows native runner compiled; bytes=$output (NO Dusk game banks)"

  private-build-toolchain:
    name: Windows cross toolchain for private local game build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned standalone Zig C/C++ Windows cross compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sha256sum zig.tar.xz
          tar -tJf zig.tar.xz | head -n 12 || true
      - name: Upload local private build toolchain (ROM-free)
        uses: actions/upload-artifact@v4
        with:
          name: private-build-zig-linux-cross-windows
          path: zig.tar.xz
          if-no-files-found: error
          retention-days: 2

  portable-launcher:
    name: Windows one-click launcher (ROM-free source build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Go native launcher
        shell: pwsh
        run: |
          cd native-launcher
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Native launcher tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Native launcher vet failed" }
      - name: Produce ROM-free Windows x64 launcher template
        shell: pwsh
        run: |
          cd native-launcher
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o ../DuskPC-Launcher-Windows-x64.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows launcher build failed" }
          & ../DuskPC-Launcher-Windows-x64.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Launcher smoke check failed" }
      - name: Upload Windows launcher template (contains NO game)
        uses: actions/upload-artifact@v4
        with:
          name: dusk-windows-one-click-launcher-rom-free
          path: DuskPC-Launcher-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  sdl3-native-windows-sdk:
    name: Native SDL3 Windows GNU SDK (ROM-free)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve pinned SDL3 Windows SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output sdl3-mingw.zip \
            https://www.libsdl.org/release/SDL3-devel-3.2.20-mingw.zip
          unzip -t sdl3-mingw.zip | tail -n 2
          sha256sum sdl3-mingw.zip | tee sdk-sha256.txt
          unzip -q sdl3-mingw.zip -d sdk
          find sdk -name SDL3Config.cmake -o -name SDL3.dll -o -name libSDL3.dll.a
      - name: Upload redistributable Windows native graphics toolkit
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-3.2.20-windows-gnu-sdk
          path: |
            sdl3-mingw.zip
            sdk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  native-desktop-launcher:
    name: Native Windows GUI launcher (no browser, ROM-free)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native-launcher/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Go unit tests (synthetic fixtures)
        shell: pwsh
        run: go test ./... -count=1 -v
      - name: Verify Windows GUI launcher (vet)
        shell: pwsh
        run: go vet ./...
      - name: Compile Windows GUI launcher (private payload added only locally)
        shell: pwsh
        run: go build -trimpath -ldflags '-s -w -H windowsgui' -o ../../build-native/Dusk-PC-Native-Launcher-ROM-Free.exe .
      - name: Upload source-only GUI launcher
        uses: actions/upload-artifact@v4
        with:
          name: dusk-pc-native-gui-launcher-windows-x64-ROM-FREE
          path: build-native/Dusk-PC-Native-Launcher-ROM-Free.exe
          if-no-files-found: error
          retention-days: 14

  dusk-native-layout-contract:
    name: Native Dusk screen layout and touch coordinate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned public NDSRecomp source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
      - name: Verify and apply native UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dusk_patches.py --upstream upstream --component native-ui
          test -f upstream/runner/src/dusk_native_ui.h
      - name: Test native viewport, touchscreen and aspect math
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I upstream/runner/src tests/native_layout_geometry.cpp -o native-layout-test
          ./native-layout-test

  native-layout-swap:
    name: Verify native SDL layout patches and touchscreen mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NDSRecomp upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/RetroPortingToolKit/ndsrecomp.git upstream
          git -C upstream checkout 3a57236bb23d25dcb4caad7d58d733311062ff5e
          git -C upstream submodule update --init --recursive
      - name: Validate then apply v0.6 compositor and new screen-swap patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dusk_patches.py --upstream upstream --component desktop
          grep -q 'd.menu_stick.poll(lx,ly)' upstream/runner/src/frontend.cpp
          grep -q 'clear_gameplay_input_for_runtime_menu();' upstream/runner/src/frontend.cpp
          grep -q 'SDL_SYSTEM_CURSOR_NWSE_RESIZE' upstream/runner/src/frontend.cpp
          grep -q 'dusk_render_rounded_screen' upstream/runner/src/frontend.cpp
          grep -q 'stick.step(rx,ry,dt,allowed)' upstream/runner/src/frontend.cpp
          grep -q 'Unsaved progress will be lost' upstream/runner/src/frontend.cpp
          grep -q 'disable_mph_ui=presentation.dusk.enabled' upstream/runner/src/frontend.cpp
          grep -q 'NDS_DUSK_DISABLE_SAVESTATES' upstream/runner/src/frontend.cpp
          grep -q 'DUSK' upstream/runner/src/frontend.cpp
      - name: Build ROM-free geometry and touch tests
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_screen_swap.cpp -o native_screen_swap
          ./native_screen_swap
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_focus_pip.cpp -o native_focus_pip
          ./native_focus_pip
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_pip_resize.cpp -o native_pip_resize
          ./native_pip_resize
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_right_stick_touch.cpp -o native_right_stick_touch
          ./native_right_stick_touch
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_pc_menu_input.cpp -o native_pc_menu_input
          ./native_pc_menu_input
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src tests/native_30hz_pacing.cpp -o native_30hz_pacing
          ./native_30hz_pacing
      - name: Test pinned upstream EEPROM 64KiB and atomic battery file persistence
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src \
            upstream/runner/tests/cart_backup_test.cpp \
            upstream/runner/src/cart_backup.cpp -o cart-backup-test
          ./cart-backup-test
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I upstream/runner/src \
            upstream/runner/tests/battery_save_test.cpp \
            upstream/runner/src/battery_save.cpp -o battery-save-test
          ./battery-save-test
